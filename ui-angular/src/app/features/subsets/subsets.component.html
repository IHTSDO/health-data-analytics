<div class="row">
	<h3 class="text-start">Subsets</h3>
</div>
<div class="row">
	<div class="col-4 border-end border-secondary-subtle">
		<ul class="nav nav-pills flex-column text-start">
			<li class="nav-item" *ngFor="let subset of subsets">
				<a
					class="nav-link"
					routerLink="/subsets/{{ subset.id }}"
					routerLinkActive="active"
					>{{ subset.name }}</a
				>
			</li>
		</ul>
		<button type="button" class="btn btn-primary mt-2" (click)="addSubset()">Add</button>
	</div>
	<div class="col text-start">
		<div *ngIf="selectedSubset.id">
			<h6>Name:</h6>
			<input class="form-control" [(ngModel)]="selectedSubset.name" name="subsetName" />
			<h6 class="mt-3">ECL (edit expression — visual builder not included in this UI):</h6>
			<textarea
				class="form-control"
				rows="8"
				name="subsetEcl"
				[(ngModel)]="newEcl"
				(ngModelChange)="eclTextareaChange($event)"
			></textarea>
			<div class="row mt-3">
				<div class="col text-end">
					<button type="button" class="btn btn-primary" (click)="saveSubset()">Save</button>
				</div>
				<div class="col text-end">
					<button type="button" class="btn btn-outline-danger" (click)="deleteSubset()">Delete</button>
				</div>
			</div>
			<div class="row mt-3" *ngIf="matchingConcepts.length">
				<div class="col">
					<h6>{{ matchingConceptsCount }} Matching Concepts (first 100 listed):</h6>
					<table class="table table-striped table-hover">
						<thead>
							<tr>
								<th>id</th>
								<th>PreferredTerm</th>
							</tr>
						</thead>
						<tbody>
							<tr *ngFor="let row of matchingConcepts">
								<td>{{ row.id }}</td>
								<td>{{ row.PreferredTerm }}</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
			<div class="row mt-3" *ngIf="!matchingConcepts.length">
				<button type="button" class="btn btn-secondary" (click)="findConcepts()">
					Find matching concepts
				</button>
			</div>
		</div>
		<div *ngIf="!selectedSubset.id">Create or select a subset to edit the ECL</div>
	</div>
</div>
